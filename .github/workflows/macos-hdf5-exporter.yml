name: macOS HDF5 Exporter

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/macos-hdf5-exporter.yml'
      - 'scripts/export_hdf5.py'
      - 'scripts/export_worker.py'
      - 'scripts/hdf5_export_app.py'
      - 'scripts/test_hdf5_exporter_spec.py'
      - 'tools/build_mac.sh'
      - 'tools/hdf5_export_app/**'
      - 'tools/requirements-*.txt'
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/macos-hdf5-exporter.yml'
      - 'scripts/export_hdf5.py'
      - 'scripts/export_worker.py'
      - 'scripts/hdf5_export_app.py'
      - 'scripts/test_hdf5_exporter_spec.py'
      - 'tools/build_mac.sh'
      - 'tools/hdf5_export_app/**'
      - 'tools/requirements-*.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-runtime.txt
            tools/requirements-build.txt

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Run packaging regression tests
        run: python scripts/test_hdf5_exporter_spec.py -v

      - name: Build app and disk image
        run: ./tools/build_mac.sh --clean --dmg --exporter-only

      - name: Verify native app bundle
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          app="tools/dist/hdf5_export_app.app"
          executable="$app/Contents/MacOS/hdf5_export_app"
          test -x "$executable"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$executable" -verify_arch "$EXPECTED_ARCHITECTURE"
          plutil -lint "$app/Contents/Info.plist"

      - name: Smoke-test packaged GUI
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time

          executable = "tools/dist/hdf5_export_app.app/Contents/MacOS/hdf5_export_app"
          environment = os.environ.copy()
          environment["QT_QPA_PLATFORM"] = "minimal"
          process = subprocess.Popen(
              [executable],
              env=environment,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          time.sleep(5)
          if process.poll() is not None:
              stdout, stderr = process.communicate()
              raise SystemExit(
                  f"Packaged GUI exited during smoke test ({process.returncode}).\n"
                  f"stdout:\n{stdout}\nstderr:\n{stderr}"
              )
          process.terminate()
          try:
              process.wait(timeout=10)
          except subprocess.TimeoutExpired:
              process.kill()
              process.wait(timeout=5)
          PY

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: MIB-HDF5-Exporter-macOS-${{ matrix.architecture }}
          path: |
            tools/dist/MIB_HDF5_Exporter_macos_${{ matrix.architecture }}.dmg
            tools/dist/MIB_HDF5_Exporter_macos_${{ matrix.architecture }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14
