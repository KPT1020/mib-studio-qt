name: Build Windows

on:
  push:
    branches: [develop]
    # Dev-lane release gate: a develop merge only cuts an auto-beta when it
    # can change the shipped desktop app. Docs, vault, tooling/exploration,
    # wheel-lane, and other-workflow merges must not advance the beta channel
    # (later patterns win; the final re-include keeps edits to this workflow
    # itself releasing so pipeline changes are exercised).
    paths:
      - '**'
      - '!docs/**'
      - '!knowledge_map/**'
      - '!tools/**'
      - '!tests/**'
      - '!bindings/python/**'
      - '!mkdocs.yml'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build-windows-impl.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        options:
          - beta
          - release
      bump:
        description: 'Version bump type (release mode only)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

# The pipeline itself lives in build-windows-impl.yml (workflow_call). It runs
# on the local self-hosted runner first (windows-sandbox VM on the lab host);
# if and only if that attempt FAILS, an identical GitHub-hosted attempt runs.
#
# Known limits of the fallback:
#   - It triggers on job failure. If the self-hosted runner is offline, the
#     local job queues (GitHub cancels queued jobs after 24h) rather than
#     failing fast, so the fallback will not fire until then. Keep the runner
#     service healthy, or cancel the run and re-dispatch.
#   - Ref/tag/release mutations happen only at the end of the pipeline, after
#     every build/test/package gate. If the local lane fails AFTER publishing
#     refs (late upload steps), the fallback lane aborts at its
#     "tag already exists" guard rather than double-publishing.
jobs:
  build-local:
    uses: ./.github/workflows/build-windows-impl.yml
    permissions:
      contents: write
    with:
      runner: '["self-hosted", "windows", "mib-studio"]'
      mode: ${{ inputs.mode || '' }}
      bump: ${{ inputs.bump || 'patch' }}
    secrets: inherit

  build-hosted-fallback:
    needs: build-local
    if: ${{ !cancelled() && needs.build-local.result == 'failure' }}
    uses: ./.github/workflows/build-windows-impl.yml
    permissions:
      contents: write
    with:
      runner: '"windows-2022"'
      mode: ${{ inputs.mode || '' }}
      bump: ${{ inputs.bump || 'patch' }}
    secrets: inherit
