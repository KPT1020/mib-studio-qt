# Builds the operator user-guide website (mkdocs.yml -> docs/manual/) and
# deploys it to GitHub Pages at https://kpt1020.github.io/mib-studio-qt/.
#
# Freshness chain: build-windows.yml (release mode) regenerates
# docs/manual/images/ with screenshot_tour and commits the PNGs back to
# main; that push matches the paths filter below, so the published site
# picks up refreshed screenshots automatically.
#
# Pull requests only build (with --strict, so broken nav/links fail);
# deploys happen from main. Requires Pages to be enabled with
# "GitHub Actions" as the source in the repository settings.
name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        # mkdocs<2: Material 9.x does not support the rewritten MkDocs 2.0
        run: pip install 'mkdocs-material>=9.5,<10' 'mkdocs<2'
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
