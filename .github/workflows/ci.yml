name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git tag version detection

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}-release
          restore-keys: |
            conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}-
            conan-${{ runner.os }}-

      - name: Install dependencies
        run: conan install . -of build --build=missing -s build_type=Release

      - name: Configure CMake
        run: cmake --preset windows-default

      - name: Build
        run: cmake --build build --config Release --target mib_studio_qt capture_processing_test

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 30

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
