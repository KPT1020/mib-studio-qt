name: Conan Remote Health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read

jobs:
  remote-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan

      - name: Check Conan remotes
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_REMOTE_USER: ${{ secrets.CONAN_REMOTE_USER }}
          CONAN_REMOTE_PASSWORD: ${{ secrets.CONAN_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail

          short_preview() {
            local input="$1"
            printf "%s" "$input" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-420
          }

          append_summary() {
            local remote="$1"
            local status="$2"
            local detail="$3"
            printf "* **%s**: %s — %s\n" "$remote" "$status" "$detail" >> "$GITHUB_STEP_SUMMARY"
          }

          overall_exit=0
          {
            echo "## Conan Remote Health"
            echo ""
            echo "Checks run at $(date -u +"%Y-%m-%dT%H:%M:%SZ")."
            echo ""
          } > "$GITHUB_STEP_SUMMARY"

          if conan list "zlib/*" -r conancenter > /tmp/conancenter.out 2>&1; then
            append_summary "conancenter" "✅ healthy" "Conan \"list zlib/*\" on conancenter succeeded."
          else
            detail=$(short_preview "$(cat /tmp/conancenter.out)")
            append_summary "conancenter" "❌ unreachable" "Conan \"list zlib/*\" failed on conancenter: ${detail}"
            overall_exit=1
          fi

          if [[ -z "${CONAN_REMOTE_URL:-}" ]]; then
            append_summary "team-conan" "⚪ skipped" "CONAN_REMOTE_URL is not set; remote not configured."
          else
            tmp_headers=$(mktemp)
            tmp_body=$(mktemp)
            tmp_err=$(mktemp)

            cleanup_team_tmp() {
              rm -f "$tmp_headers" "$tmp_body" "$tmp_err"
            }
            trap cleanup_team_tmp EXIT

            if ! curl_status_code=$(curl -sS --max-time 20 \
                -D "$tmp_headers" \
                -o "$tmp_body" \
                "$CONAN_REMOTE_URL/v1/ping" \
                -w "%{http_code}" 2>"$tmp_err"); then
              detail=$(short_preview "$(cat "$tmp_err")")
              append_summary "team-conan" "❌ unreachable" "HTTP probe failed to ${CONAN_REMOTE_URL}/v1/ping: ${detail}"
              overall_exit=1
            else
              content_type=$(sed -n '1,20p' "$tmp_headers" | tr -d '\r' | grep -i '^content-type:' | sed 's/[^:]*: //i' | tr -d ' ')
              if [[ "$curl_status_code" != 2* ]] || [[ "$content_type" == *text/html* ]]; then
                detail="HTTP status=${curl_status_code}; Content-Type=${content_type:-unknown}"
                if grep -qiE "(html|cloudflare|error 1033|error 530|cf-ray|tunnel)" "$tmp_body"; then
                  detail="${detail}; HTML-like remote response detected."
                fi
                append_summary "team-conan" "❌ unhealthy" "HTTP probe to ${CONAN_REMOTE_URL}/v1/ping failed: ${detail}"
                overall_exit=1
              else
                if conan remote add team-conan "$CONAN_REMOTE_URL" --force > /tmp/team_remote_add.out 2>&1; then
                  if [[ -n "${CONAN_REMOTE_USER:-}" && -n "${CONAN_REMOTE_PASSWORD:-}" ]]; then
                    if ! conan remote login team-conan "$CONAN_REMOTE_USER" -p "$CONAN_REMOTE_PASSWORD" > /tmp/team_login.out 2>&1; then
                      detail=$(short_preview "$(cat /tmp/team_login.out)")
                      append_summary "team-conan" "❌ auth-failed" "Conan auth rejected for team-conan: ${detail}"
                      overall_exit=1
                    elif ! conan list "*" -r team-conan > /tmp/team_list.out 2>&1; then
                      detail=$(short_preview "$(cat /tmp/team_list.out)")
                      append_summary "team-conan" "❌ unhealthy" "Conan \"list * -r team-conan\" failed after login: ${detail}"
                      overall_exit=1
                    else
                    append_summary "team-conan" "✅ healthy" "Cloudflare/HTML check passed, auth succeeded, and \"conan list * -r team-conan\" succeeded."
                    fi
                  elif ! conan list "*" -r team-conan > /tmp/team_list.out 2>&1; then
                    detail=$(short_preview "$(cat /tmp/team_list.out)")
                    append_summary "team-conan" "❌ unhealthy" "Conan \"list * -r team-conan\" failed: ${detail}"
                    overall_exit=1
                  else
                    append_summary "team-conan" "✅ healthy" "Cloudflare/HTML check passed and anonymous Conan read succeeded."
                  fi
                else
                  detail=$(short_preview "$(cat /tmp/team_remote_add.out)")
                  append_summary "team-conan" "❌ unhealthy" "Failed to add team-conan remote: ${detail}"
                  overall_exit=1
                fi
              fi
            fi
          fi

          if [[ $overall_exit -ne 0 ]]; then
            {
              echo ""
              echo "## Result: ❌ failing"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "## Result: ✅ healthy"
            echo "All enabled Conan remotes responded successfully."
          } >> "$GITHUB_STEP_SUMMARY"
