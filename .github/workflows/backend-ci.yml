name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Linux backend-only build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directory
        shell: bash
        run: mkdir -p artifacts/backend-ci

      - name: Install Linux system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libhdf5-dev \
            libopencv-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            nlohmann-json3-dev \
            pkg-config \
            python3-pip \
            qt6-base-dev \
            qt6-serialport-dev

      - name: Install Conan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install conan
          conan profile detect --force

      - name: Probe Conan dependency availability
        shell: bash
        run: |
          set +e
          conan install . \
            --profile:host=conan/profiles/linux-gcc13 \
            --profile:build=default \
            --output-folder=build/linux-backend-conan \
            --build=never \
            -c tools.system.package_manager:mode=report \
            2>&1 | tee artifacts/backend-ci/conan-install.log
          conan_status=${PIPESTATUS[0]}
          set -e
          if [ "$conan_status" -ne 0 ]; then
            echo "::warning::Conan dependency availability probe exited ${conan_status}; backend-only configure/build/test uses Linux system packages. See artifacts/backend-ci/conan-install.log."
          fi

      - name: Configure backend-only preset
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-backend-only 2>&1 | tee artifacts/backend-ci/configure.log

      - name: Build backend-only preset
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-backend-only-build 2>&1 | tee artifacts/backend-ci/build.log

      - name: Test backend-only preset
        shell: bash
        run: |
          set -o pipefail
          ctest --preset linux-backend-only-test --output-on-failure 2>&1 | tee artifacts/backend-ci/test.log

      - name: Upload backend CI logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-ci-logs-${{ github.run_id }}
          path: |
            artifacts/backend-ci/*.log
            build/linux-backend/Testing/Temporary/LastTest.log
            build/linux-backend/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
