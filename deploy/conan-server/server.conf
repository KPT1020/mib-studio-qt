# Conan Server configuration
# Docs: https://docs.conan.io/2/reference/config_files/server.conf.html

[server]
jwt_secret: CHANGE_ME_TO_RANDOM_HEX
jwt_expire_minutes: 120
host_name: 0.0.0.0
port: 9300
ssl_enabled: false

[write_permissions]
# Pattern: user list
# Allow ci user to upload any package
*/*@*/*: ci

[read_permissions]
# Anyone authenticated can read
*/*@*/*: *

[users]
# username: password
# IMPORTANT: Change these credentials before deploying!
ci: changeme
