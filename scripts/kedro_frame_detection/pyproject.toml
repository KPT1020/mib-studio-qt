[project]
name = "frame-detection"
version = "0.1.0"
description = "Kedro pipeline for empty frame detection in microscopy images"
requires-python = ">=3.10"
dependencies = [
    "kedro>=0.19.0,<0.20",
    "mlflow>=2.10.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.kedro]
package_name = "frame_detection"
project_name = "Frame Detection"
kedro_init_version = "0.19.0"
tools = ""
example_pipeline = "false"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "30e3edba4b0d42418f36b547f55a678f"
